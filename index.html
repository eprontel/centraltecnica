            ip: "192.168.10.142",
            acesso: "http://45.162.104.134:1026",
            porta: "1026",
            usuario: "admin",
            senha: "Eprontel30311@"
        }
    ]
}

];

function carregarClientes() {

    const container = document.getElementById('clientes');

    container.innerHTML = "";

    dados.forEach(cliente => {

        let html = `
        <div class="card">
            <h2>${cliente.cliente}</h2>

            <table>

            <tr>
                <th>Equipamento</th>
                <th>IP</th>
                <th>Acesso</th>
                <th>Porta</th>
                <th>Usuário</th>
                <th>Senha</th>
            </tr>
        `;

        cliente.equipamentos.forEach(eq => {

            html += `
            <tr>
                <td>${eq.equipamento}</td>
                <td>${eq.ip}</td>
                <td>
                    <a href="${eq.acesso}" target="_blank">
                    Abrir acesso
                    </a>
                </td>
                <td>${eq.porta}</td>
                <td>${eq.usuario}</td>
                <td>${eq.senha}</td>
            </tr>
            `;
        });

        html += `
            </table>
        </div>
        `;

        container.innerHTML += html;

    });

}

function buscarClientes(){

    let filtro = document
        .getElementById('busca')
        .value
        .toLowerCase();

    let cards = document.getElementsByClassName('card');

    for(let i=0;i<cards.length;i++){

        let texto = cards[i].innerText.toLowerCase();

        if(texto.includes(filtro)){
            cards[i].style.display = "";
        } else {
            cards[i].style.display = "none";
        }

    }

}

carregarClientes();

</script>
