<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Técnica NN Segurança</title>

<style>
:root {
    --bg:#0f172a;
    --panel:#111827;
    --card:#1e293b;
    --card2:#243449;
    --line:#334155;
    --text:#f8fafc;
    --muted:#94a3b8;
    --blue:#38bdf8;
    --green:#22c55e;
    --red:#f87171;
}
* { box-sizing:border-box; }
body {
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#0f172a,#111827);
    color:var(--text);
}
header {
    background:linear-gradient(135deg,#020617,#111827);
    padding:24px 20px;
    border-bottom:1px solid var(--line);
    text-align:center;
}
header h1 { margin:0; font-size:30px; letter-spacing:.3px; }
header p { margin:8px 0 0; color:var(--muted); font-size:14px; }
.topbar {
    background:var(--panel);
    padding:18px 20px;
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:12px;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid var(--line);
}
input, select, button {
    padding:13px;
    border:none;
    border-radius:10px;
    font-size:15px;
}
input, select { width:100%; background:#f8fafc; color:#0f172a; }
button { cursor:pointer; background:#2563eb; color:white; font-weight:bold; }
button:hover { filter:brightness(1.1); }
.status { padding:16px 20px; color:var(--muted); }
.dashboard {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    padding:20px;
}
.metric {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.metric span { display:block; color:var(--muted); font-size:13px; }
.metric strong { display:block; margin-top:8px; font-size:30px; color:var(--blue); }
.container { padding:0 20px 30px; }
.card {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin-bottom:22px;
    box-shadow:0 8px 22px rgba(0,0,0,.28);
}
.card-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}
.card h2 { margin:0; color:var(--blue); font-size:24px; }
.badge {
    background:#0f172a;
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 12px;
    color:var(--muted);
    font-size:13px;
}
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; min-width:900px; }
th { background:#0f172a; padding:12px; text-align:left; color:#e2e8f0; }
td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:hover { background:var(--card2); }
a { color:var(--green); font-weight:bold; text-decoration:none; }
.small-btn {
    padding:7px 9px;
    border-radius:8px;
    font-size:12px;
    margin-left:5px;
    background:#334155;
}
.copy-btn { background:#475569; }
.show-btn { background:#0ea5e9; }
.senha { font-family:monospace; letter-spacing:.5px; }
.erro { color:var(--red); padding:20px; line-height:1.5; }
footer {
    text-align:center;
    padding:25px;
    background:#020617;
    color:var(--muted);
    border-top:1px solid var(--line);
}
@media(max-width:900px) {
    .topbar { grid-template-columns:1fr; }
    .dashboard { grid-template-columns:1fr 1fr; }
    header h1 { font-size:23px; }
}
@media(max-width:520px) {
    .dashboard { grid-template-columns:1fr; }
}
</style>

<script>
const usuarios = [
    { usuario: "eprontel", senha: "Adl141103$" },
    { usuario: "osmar", senha: "osmar21082026" }
];

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSbzQGBfaz8LUu7X66fcCkRxz5xsWcMY2vwHQOB2-uK7zUwuAl74YTTRJOteM43MWiCgFxKG4MLmgYj/pub?gid=226390867&single=true&output=csv";
let dadosGlobais = [];

window.onload = function(){
    const usuarioDigitado = prompt("Usuário:");
    const senhaDigitada = prompt("Senha:");

    const acessoLiberado = usuarios.some(u => usuarioDigitado === u.usuario && senhaDigitada === u.senha);

    if(!acessoLiberado){
        alert("Acesso negado");
        document.body.innerHTML = "<h1 style='text-align:center;margin-top:100px;'>Acesso bloqueado</h1>";
        return;
    }

    carregarDadosGoogleSheets();
};

function parseCSV(texto){
    const linhas = [];
    let linha = [];
    let campo = "";
    let dentroAspas = false;

    for(let i=0;i<texto.length;i++){
        const char = texto[i];
        const prox = texto[i+1];

        if(char === '"' && dentroAspas && prox === '"'){
            campo += '"';
            i++;
        }else if(char === '"'){
            dentroAspas = !dentroAspas;
        }else if(char === "," && !dentroAspas){
            linha.push(campo);
            campo = "";
        }else if((char === "\n" || char === "\r") && !dentroAspas){
            if(char === "\r" && prox === "\n") i++;
            linha.push(campo);
            if(linha.some(c => String(c).trim() !== "")) linhas.push(linha);
            linha = [];
            campo = "";
        }else{
            campo += char;
        }
    }

    if(campo !== "" || linha.length > 0){
        linha.push(campo);
        if(linha.some(c => String(c).trim() !== "")) linhas.push(linha);
    }

    return linhas;
}

function escaparHTML(texto){
    return (texto || "").toString()
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function limparParaParametro(texto){
    return (texto || "").toString().replace(/'/g, "\'").replace(/"/g, "&quot;");
}

function ehURL(texto){
    const t = (texto || "").trim().toLowerCase();
    return t.startsWith("http://") || t.startsWith("https://");
}

function montarLinkAcesso(acesso){
    if(ehURL(acesso)){
        return `<a href="${escaparHTML(acesso)}" target="_blank">Abrir acesso</a>`;
    }
    return escaparHTML(acesso);
}

function copiarTexto(texto){
    navigator.clipboard.writeText(texto || "").then(() => {
        alert("Copiado!");
    });
}

function alternarSenha(botao){
    const span = botao.parentElement.querySelector(".senha");
    const valor = span.getAttribute("data-valor");
    const visivel = span.getAttribute("data-visivel") === "1";

    if(visivel){
        span.innerText = "••••••••";
        span.setAttribute("data-visivel","0");
        botao.innerText = "Mostrar";
    }else{
        span.innerText = valor;
        span.setAttribute("data-visivel","1");
        botao.innerText = "Ocultar";
    }
}

async function carregarDadosGoogleSheets(){
    const status = document.getElementById("status");

    try{
        status.innerText = "Carregando dados da planilha...";

        const resposta = await fetch(CSV_URL + "&cache=" + Date.now());
        if(!resposta.ok) throw new Error("Erro HTTP " + resposta.status + " ao carregar o CSV.");

        const csv = await resposta.text();
        const linhas = parseCSV(csv);

        if(linhas.length < 2) throw new Error("A planilha não possui dados.");

        dadosGlobais = [];

        for(let i=1;i<linhas.length;i++){
            const l = linhas[i];

            const item = {
                cliente:(l[0] || "").trim(),
                equipamento:(l[1] || "").trim(),
                ip:(l[2] || "").trim(),
                acesso:(l[3] || "").trim(),
                porta:(l[4] || "").trim(),
                usuario:(l[5] || "").trim(),
                senha:(l[6] || "").trim()
            };

            if(!item.cliente && !item.equipamento && !item.ip && !item.acesso && !item.porta && !item.usuario && !item.senha) continue;

            dadosGlobais.push(item);
        }

        preencherFiltroClientes();
        renderizar();
        status.innerText = "Dados carregados com sucesso.";

    }catch(erro){
        console.error(erro);
        status.innerHTML = `<div class="erro">Não foi possível carregar a planilha.<br><strong>Erro:</strong> ${escaparHTML(erro.message)}</div>`;
    }
}

function preencherFiltroClientes(){
    const select = document.getElementById("filtroCliente");
    const clientes = [...new Set(dadosGlobais.map(d => d.cliente || "Sem cliente"))].sort();

    select.innerHTML = `<option value="">Todos os clientes</option>`;
    clientes.forEach(c => {
        select.innerHTML += `<option value="${escaparHTML(c)}">${escaparHTML(c)}</option>`;
    });
}

function renderizar(){
    const busca = document.getElementById("busca").value.toLowerCase();
    const clienteFiltro = document.getElementById("filtroCliente").value;
    const container = document.getElementById("clientes");

    const filtrados = dadosGlobais.filter(d => {
        const texto = `${d.cliente} ${d.equipamento} ${d.ip} ${d.acesso} ${d.porta} ${d.usuario} ${d.senha}`.toLowerCase();
        const bateBusca = texto.includes(busca);
        const bateCliente = !clienteFiltro || d.cliente === clienteFiltro;
        return bateBusca && bateCliente;
    });

    const grupos = {};
    filtrados.forEach(d => {
        const nome = d.cliente || "Sem cliente";
        if(!grupos[nome]) grupos[nome] = [];
        grupos[nome].push(d);
    });

    atualizarDashboard(filtrados);

    let html = "";

    Object.keys(grupos).sort().forEach(cliente => {
        html += `
        <div class="card">
            <div class="card-header">
                <h2>${escaparHTML(cliente)}</h2>
                <div class="badge">${grupos[cliente].length} equipamentos</div>
            </div>
            <div class="table-wrap">
            <table>
                <tr>
                    <th>Equipamento</th>
                    <th>IP</th>
                    <th>Acesso</th>
                    <th>Porta</th>
                    <th>Usuário</th>
                    <th>Senha</th>
                </tr>`;

        grupos[cliente].forEach(eq => {
            const ipSafe = limparParaParametro(eq.ip);
            const usuarioSafe = limparParaParametro(eq.usuario);
            const senhaSafe = limparParaParametro(eq.senha);
            html += `
                <tr>
                    <td>${escaparHTML(eq.equipamento)}</td>
                    <td>${escaparHTML(eq.ip)} <button class="small-btn copy-btn" onclick="copiarTexto('${ipSafe}')">Copiar</button></td>
                    <td>${montarLinkAcesso(eq.acesso)}</td>
                    <td>${escaparHTML(eq.porta)}</td>
                    <td>${escaparHTML(eq.usuario)} <button class="small-btn copy-btn" onclick="copiarTexto('${usuarioSafe}')">Copiar</button></td>
                    <td>
                        <span class="senha" data-visivel="0" data-valor="${escaparHTML(eq.senha)}">••••••••</span>
                        <button class="small-btn show-btn" onclick="alternarSenha(this)">Mostrar</button>
                        <button class="small-btn copy-btn" onclick="copiarTexto('${senhaSafe}')">Copiar</button>
                    </td>
                </tr>`;
        });

        html += `
            </table>
            </div>
        </div>`;
    });

    if(!html){
        html = `<div class="erro">Nenhum resultado encontrado.</div>`;
    }

    container.innerHTML = html;
}

function atualizarDashboard(lista){
    const clientes = new Set(lista.map(d => d.cliente || "Sem cliente"));
    const acessos = lista.filter(d => ehURL(d.acesso)).length;
    const senhas = lista.filter(d => d.senha).length;

    document.getElementById("totalClientes").innerText = clientes.size;
    document.getElementById("totalEquipamentos").innerText = lista.length;
    document.getElementById("totalAcessos").innerText = acessos;
    document.getElementById("totalSenhas").innerText = senhas;
}

function limparFiltros(){
    document.getElementById("busca").value = "";
    document.getElementById("filtroCliente").value = "";
    renderizar();
}
</script>
</head>

<body>
<header>
    <h1>Central Técnica - CFTV & Controle de Acesso</h1>
    <p>NN Segurança • Inventário técnico online • Dados via Google Sheets</p>
</header>

<div class="topbar">
    <input type="text" id="busca" onkeyup="renderizar()" placeholder="Buscar cliente, IP, equipamento, porta ou usuário...">
    <select id="filtroCliente" onchange="renderizar()">
        <option value="">Todos os clientes</option>
    </select>
    <button onclick="limparFiltros()">Limpar filtros</button>
</div>

<div id="status" class="status"></div>

<div class="dashboard">
    <div class="metric"><span>Clientes</span><strong id="totalClientes">0</strong></div>
    <div class="metric"><span>Equipamentos</span><strong id="totalEquipamentos">0</strong></div>
    <div class="metric"><span>Acessos com link</span><strong id="totalAcessos">0</strong></div>
    <div class="metric"><span>Senhas cadastradas</span><strong id="totalSenhas">0</strong></div>
</div>

<div class="container" id="clientes"></div>

<footer>Central Técnica © 2026 • NN Segurança</footer>
</body>
</html>
