<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Técnica</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
}

header{
    background:#111827;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom:2px solid #1e293b;
}

.search{
    padding:20px;
    background:#111827;
}

.search input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

.container{
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
}

.card h2{
    margin-top:0;
    color:#38bdf8;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background:#0f172a;
    padding:10px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #334155;
}

tr:hover{
    background:#334155;
}

a{
    color:#22c55e;
    font-weight:bold;
    text-decoration:none;
}

footer{
    text-align:center;
    padding:20px;
    background:#111827;
    margin-top:40px;
    color:#94a3b8;
}

.status{
    padding:15px 20px;
    color:#94a3b8;
}

.erro{
    color:#f87171;
    padding:20px;
}
</style>

<script>

const usuarios = [
    {
        usuario: "eprontel",
        senha: "Adl141103$"
    },
    {
        usuario: "osmar",
        senha: "osmar21082026"
    }
];

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQKwaZQPoN-zO1ZPMdN6AOlgtGqUltsRAir0VIO2Q8SBy9er1uMQOSBtRSlODauTQ/pub?gid=1313662978&single=true&output=csv";

window.onload = function() {

    let usuarioDigitado = prompt("Usuário:");
    let senhaDigitada = prompt("Senha:");

    let acessoLiberado = false;

    for (let i = 0; i < usuarios.length; i++) {

        if (
            usuarioDigitado === usuarios[i].usuario &&
            senhaDigitada === usuarios[i].senha
        ) {
            acessoLiberado = true;
            break;
        }
    }

    if (!acessoLiberado) {

        alert("Acesso negado");

        document.body.innerHTML = "<h1 style='text-align:center;margin-top:100px;'>Acesso bloqueado</h1>";

        return;
    }

    carregarDadosGoogleSheets();
}


function detectarSeparador(texto) {
    const primeiraLinha = texto.split(/\r?\n/)[0] || "";
    const virgulas = (primeiraLinha.match(/,/g) || []).length;
    const pontoVirgulas = (primeiraLinha.match(/;/g) || []).length;
    return pontoVirgulas > virgulas ? ";" : ",";
}

function parseCSV(texto) {
    const separador = detectarSeparador(texto);
    const linhas = [];
    let linha = [];
    let campo = "";
    let dentroAspas = false;

    for (let i = 0; i < texto.length; i++) {
        const char = texto[i];
        const prox = texto[i + 1];

        if (char === '"' && dentroAspas && prox === '"') {
            campo += '"';
            i++;
        } else if (char === '"') {
            dentroAspas = !dentroAspas;
        } else if (char === separador && !dentroAspas) {
            linha.push(campo);
            campo = "";
        } else if ((char === "\n" || char === "\r") && !dentroAspas) {
            if (char === "\r" && prox === "\n") i++;
            linha.push(campo);
            if (linha.some(c => c.trim() !== "")) linhas.push(linha);
            linha = [];
            campo = "";
        } else {
            campo += char;
        }
    }

    if (campo !== "" || linha.length > 0) {
        linha.push(campo);
        if (linha.some(c => c.trim() !== "")) linhas.push(linha);
    }

    return linhas;
}

function localizarColuna(cabecalho, nomesPossiveis, posicaoPadrao) {
    for (const nome of nomesPossiveis) {
        const indice = cabecalho.indexOf(normalizar(nome));
        if (indice >= 0) return indice;
    }
    return posicaoPadrao;
}

function normalizar(texto) {
    return (texto || "")
        .toString()
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

function escaparHTML(texto) {
    return (texto || "")
        .toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function ehURL(texto) {
    const t = (texto || "").trim().toLowerCase();
    return t.startsWith("http://") || t.startsWith("https://");
}

async function carregarDadosGoogleSheets() {
    const container = document.getElementById("clientes");
    const status = document.getElementById("status");

    try {
        status.innerText = "Carregando dados da planilha...";

        const resposta = await fetch(CSV_URL + "&cache=" + new Date().getTime());

        if (!resposta.ok) {
            throw new Error("Erro ao carregar a planilha.");
        }

        const csv = await resposta.text();
        const linhas = parseCSV(csv);

        if (linhas.length < 2) {
            throw new Error("A planilha está vazia ou não possui dados.");
        }

        const cabecalho = linhas[0].map(normalizar);

        // Ordem correta da planilha:
        // A Cliente | B Equipamento | C IP | D Acesso | E Porta | F Usuario | G Senha
        const colCliente = localizarColuna(cabecalho, ["cliente", "condominio", "condomínio"], 0);
        const colEquipamento = localizarColuna(cabecalho, ["equipamento", "dispositivo", "descricao", "descrição"], 1);
        const colIP = localizarColuna(cabecalho, ["ip", "endereco ip", "endereço ip"], 2);
        const colAcesso = localizarColuna(cabecalho, ["acesso", "url", "link", "ddns"], 3);
        const colPorta = localizarColuna(cabecalho, ["porta", "porta http", "porta servico", "porta serviço"], 4);
        const colUsuario = localizarColuna(cabecalho, ["usuario", "usuário", "user", "login"], 5);
        const colSenha = localizarColuna(cabecalho, ["senha", "password", "pass"], 6);

        if (linhas[0].length < 7) {
            throw new Error("A aba precisa ter pelo menos 7 colunas nesta ordem: Cliente, Equipamento, IP, Acesso, Porta, Usuario, Senha.");
        }

        const clientes = {};

        for (let i = 1; i < linhas.length; i++) {
            const l = linhas[i];

            const cliente = (l[colCliente] || "").trim();
            const equipamento = (l[colEquipamento] || "").trim();
            const ip = (l[colIP] || "").trim();
            const acesso = (l[colAcesso] || "").trim();
            const porta = colPorta >= 0 ? (l[colPorta] || "").trim() : "";
            const usuario = colUsuario >= 0 ? (l[colUsuario] || "").trim() : "";
            const senha = colSenha >= 0 ? (l[colSenha] || "").trim() : "";

            if (!cliente && !equipamento && !ip && !acesso && !porta && !usuario && !senha) {
                continue;
            }

            const nomeCliente = cliente || "Sem cliente";

            if (!clientes[nomeCliente]) {
                clientes[nomeCliente] = [];
            }

            clientes[nomeCliente].push({
                equipamento,
                ip,
                acesso,
                porta,
                usuario,
                senha
            });
        }

        let html = "";

        Object.keys(clientes).forEach(cliente => {
            html += `
                <div class="card">
                    <h2>${escaparHTML(cliente)}</h2>
                    <table>
                        <tr>
                            <th>Equipamento</th>
                            <th>IP</th>
                            <th>Acesso</th>
                            <th>Porta</th>
                            <th>Usuário</th>
                            <th>Senha</th>
                        </tr>
            `;

            clientes[cliente].forEach(eq => {
                let acessoHTML = "";

                if (ehURL(eq.acesso)) {
                    acessoHTML = `<a href="${escaparHTML(eq.acesso)}" target="_blank">Abrir acesso</a>`;
                } else {
                    acessoHTML = escaparHTML(eq.acesso);
                }

                html += `
                    <tr>
                        <td>${escaparHTML(eq.equipamento)}</td>
                        <td>${escaparHTML(eq.ip)}</td>
                        <td>${acessoHTML}</td>
                        <td>${escaparHTML(eq.porta)}</td>
                        <td>${escaparHTML(eq.usuario)}</td>
                        <td>${escaparHTML(eq.senha)}</td>
                    </tr>
                `;
            });

            html += `
                    </table>
                </div>
            `;
        });

        container.innerHTML = html;
        status.innerText = "Dados carregados com sucesso. Colunas lidas na ordem: Cliente, Equipamento, IP, Acesso, Porta, Usuário e Senha.";

    } catch (erro) {
        console.error(erro);
        status.innerHTML = `<div class="erro">Não foi possível carregar a planilha. Verifique se ela está publicada como CSV e se as colunas estão corretas.</div>`;
    }
}

function buscarClientes() {

    let filtro = document.getElementById('busca').value.toLowerCase();

    let cards = document.getElementsByClassName('card');

    for (let i = 0; i < cards.length; i++) {

        let texto = cards[i].innerText.toLowerCase();

        if(texto.includes(filtro)){
            cards[i].style.display = "";
        } else {
            cards[i].style.display = "none";
        }
    }
}
</script>

</head>

<body>

<header>
Central Técnica - CFTV & Controle de Acesso
</header>

<div class="search">
<input type="text" id="busca" onkeyup="buscarClientes()" placeholder="Buscar cliente, IP ou equipamento...">
</div>

<div id="status" class="status"></div>

<div class="container" id="clientes"></div>

<footer>
Central Técnica © 2026
</footer>

</body>
</html>
